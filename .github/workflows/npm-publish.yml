name: Publish rustybara-wasm to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'rustybara-wasm-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust and the wasm32 target
        run: |
          rustup toolchain install stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Update npm for trusted publishing and provenance
        run: npm install --global npm@latest

      - name: Build Node package
        working-directory: rustybara-wasm
        run: wasm-pack build --target nodejs --out-dir pkg-node --release

      - name: Add package documentation and license
        run: |
          cp rustybara-wasm/README.md rustybara-wasm/pkg-node/README.md
          cp LICENSE-LGPL-3.0 rustybara-wasm/pkg-node/LICENSE

      - name: Test Node package
        run: node rustybara-wasm/tests/node-smoke.cjs

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#rustybara-wasm-v}"
          actual="$(node -p "require('./rustybara-wasm/pkg-node/package.json').version")"
          test "$actual" = "$expected" || {
            echo "tag version $expected does not match package version $actual" >&2
            exit 1
          }

      - name: Pack npm tarball
        run: |
          mkdir -p rustybara-wasm/dist
          npm pack ./rustybara-wasm/pkg-node --pack-destination ./rustybara-wasm/dist

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustybara-wasm-npm
          path: rustybara-wasm/dist/*.tgz
          if-no-files-found: error

      - name: Publish to npm with provenance
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: rustybara-wasm/pkg-node
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
