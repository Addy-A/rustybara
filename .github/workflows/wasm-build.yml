name: Build WASM

on:
  push:
    branches: [main, master]
    paths:
      - 'rustybara-wasm/**'
      - 'rustybara/src/**'
      - '.github/workflows/wasm-build.yml'

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust wasm32 target
        run: |
          rustup toolchain install stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm
        working-directory: rustybara-wasm
        run: wasm-pack build --target web --out-dir pkg --release

      - name: Checkout website repository
        uses: actions/checkout@v5
        with:
          repository: Addy-A/rustybara-website
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          path: _website

      - name: Deploy wasm artifact to website repo
        run: |
          mkdir -p _website/static/wasm _website/static/samples
          cp rustybara-wasm/pkg/rustybara_wasm.js      _website/static/wasm/
          cp rustybara-wasm/pkg/rustybara_wasm_bg.wasm _website/static/wasm/
          cp rustybara-wasm/pkg/rustybara_wasm.d.ts    _website/static/wasm/
          cargo run --manifest-path rustybara-wasm/Cargo.toml \
            --bin gen-samples --features gen-samples \
            -- _website/static/samples
          cd _website
          git config user.name  "rustybara-ci"
          git config user.email "ci@rustybara.dev"
          git add -f static/wasm/ static/samples/
          git diff --cached --quiet || git commit -m "chore: update wasm artifact from rustybara@${{ github.sha }}"
          git push
