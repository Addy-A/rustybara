[package]
name = "rustybara-wasm"
version = "0.2.0"
edition = "2024"
description = "WebAssembly bindings for rustybara — PDF operations in Node.js and browsers"
license = "LGPL-3.0-only"
repository = "https://github.com/Addy-A/rustybara"
homepage = "https://rustybara.com"
readme = "README.md"
keywords = ["pdf", "prepress", "webassembly", "wasm", "nodejs"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gen-samples"
path = "src/bin/gen_samples.rs"
required-features = ["gen-samples"]

[features]
gen-samples = ["dep:lopdf"]

[dependencies]
rustybara = { path = "../rustybara", version = "0.2.0", default-features = false, features = ["wasm", "outline"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
lopdf = { version = "0.40.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
