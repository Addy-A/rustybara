[package]
name = "rbv"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
image = "0.25.10"
rustybara = { path = "../rustybara", features = ["raster"] }
winit = "0.30.13"
skia-safe = "0.97.0"
softbuffer = "0.4.8"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
notify = "8.2.0"
