[package]
name = "rbv"
version = "0.1.2"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
image = "0.25.10"
rustybara = { path = "../rustybara", features = ["raster", "outline"] }
rustybara-icc = { path = "../rustybara-icc", features = ["bundled-profiles"] }
pdfium-render = { version = "0.9.0", features = ["thread_safe"] }
winit = "0.30.13"
skia-safe = { version = "0.97.0", features = ["gl"] }
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
clap = { version = "4", features = ["derive"] }
notify = "8.2.0"
egui = "0.34.2"
egui-winit = "0.34.2"

[dev-dependencies]
tempfile = "3"
