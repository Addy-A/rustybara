[package]
name = "rbv"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
image = "0.25.10"
rustybara = { path = "../rustybara", features = ["raster", "outline"] }
winit = "0.30.13"
skia-safe = { version = "0.97.0", features = ["gl"] }
glutin = "0.32.3"
glutin-winit = "0.5.0"
raw-window-handle = "0.6.2"
clap = { version = "4", features = ["derive"] }
notify = "8.2.0"

[dev-dependencies]
tempfile = "3"
